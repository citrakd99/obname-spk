<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Obname SPK</title>
<meta name="theme-color" content="#7a3e1d">
<meta name="description" content="Tracking, forecast 2 mingguan, dan pengajuan obname mandor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="login">
  <img src="icons/icon-192.png" width="72" height="72" alt="" style="border-radius:16px">
  <h1>Obname SPK</h1>
  <p class="mut" style="text-align:center;margin:0 0 16px">Masukkan kode akses untuk melanjutkan</p>
  <div id="urlBox" hidden style="width:100%">
    <label for="urlIn">Alamat server (URL Web App /exec)</label>
    <input id="urlIn" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
  </div>
  <label for="codeIn" style="margin-top:8px">Kode akses</label>
  <input id="codeIn" type="password" autocomplete="off" style="text-align:center;letter-spacing:2px">
  <label class="chk"><input type="checkbox" id="remember"> Ingat di perangkat ini</label>
  <div class="err" id="loginErr"></div>
  <button class="btn" id="loginBtn">Masuk</button>
  <button class="link" id="urlToggle" type="button">Ubah alamat server</button>
</section>

<div id="app" hidden>
  <header class="bar">
    <div class="bar-l">
      <b id="hTitle"></b>
      <select id="spkSel" aria-label="Pilih SPK"></select>
    </div>
    <div class="bar-r">
      <span id="roleTag" class="pill"></span>
      <button class="ibtn qs-only" id="btnSet" aria-label="Pengaturan">⚙</button>
    </div>
  </header>
  <div id="banner" role="status"></div>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>

<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<div id="printRoot"></div>

<script src="config.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
